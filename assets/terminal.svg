  <text x="20" y="594" font-size="13" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="7.62s" dur="0.15s" fill="freeze"/><tspan fill="#9bc1bc">email  </tspan><tspan fill="#edf1e8" opacity="0.85">omrajputt369@gmail.com</tspan></text>
