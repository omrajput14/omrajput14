<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" width="720">
  <defs>
    <style>
      .bg    { fill: #141414; }
      .text  { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; }
      .dim   { fill: #edf1e8; opacity: 0.35; }
      .plain { fill: #edf1e8; opacity: 0.85; }
      .coral { fill: #ed6a5a; }
      .teal  { fill: #9bc1bc; }
      .sage  { fill: #d7dbd2; }
      .green { fill: #28c840; }
      .cmd   { fill: #edf1e8; }
    </style>
  </defs>

  <!-- Window -->
  <rect width="720" height="700" rx="14" class="bg"/>

  <!-- Title bar -->
  <rect y="28" width="720" height="12" class="bg"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="6" fill="#febc2e"/>
  <circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="360" y="25" text-anchor="middle" class="text dim" font-size="12">omrajput14 — zsh</text>

  <!-- Separator -->
  <rect y="40" width="720" height="1" fill="#edf1e8" opacity="0.08"/>

  <!-- ── whoami ── -->
  <text y="72" class="text">
    <tspan x="20" class="coral">omrajput14</tspan><tspan class="dim">@github</tspan><tspan class="dim">:~$ </tspan><tspan class="cmd">whoami</tspan>
  </text>
  <text y="94"  class="text"><tspan x="20" class="teal">name</tspan><tspan class="dim">      </tspan><tspan class="plain">Om Rajput</tspan></text>
  <text y="114" class="text"><tspan x="20" class="teal">role</tspan><tspan class="dim">      </tspan><tspan class="plain">Systems Engineer — backend · spatial · mobile</tspan></text>
