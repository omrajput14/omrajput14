  <text x="20" y="272" font-size="13" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.05s" dur="0.15s" fill="freeze"/><tspan fill="#9bc1bc">● </tspan><tspan fill="#edf1e8">VETRA-Gov         </tspan><tspan fill="#edf1e8" opacity="0.4">Disease surveillance · Java + PostgreSQL</tspan></text>
  <text x="20" y="290" font-size="13" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.25s" dur="0.15s" fill="freeze"/><tspan fill="#f4f1bb">● </tspan><tspan fill="#edf1e8">AgriFlow          </tspan><tspan fill="#edf1e8" opacity="0.4">Export intelligence · React + FastAPI + Three.js</tspan></text>
  <text x="20" y="308" font-size="13" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.45s" dur="0.15s" fill="freeze"/><tspan fill="#9bc1bc">● </tspan><tspan fill="#edf1e8">JalSetu           </tspan><tspan fill="#edf1e8" opacity="0.4">Municipal water · React + FastAPI + Razorpay</tspan></text>
  <text x="20" y="326" font-size="13" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.65s" dur="0.15s" fill="freeze"/><tspan fill="#f4f1bb">● </tspan><tspan fill="#edf1e8">AgroShield        </tspan><tspan fill="#edf1e8" opacity="0.4">Crop protection · FastAPI + scikit-learn</tspan></text>
  <text x="20" y="344" font-size="13" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.85s" dur="0.15s" fill="freeze"/><tspan fill="#ed6a5a">● </tspan><tspan fill="#edf1e8">EcoIrrigate       </tspan><tspan fill="#edf1e8" opacity="0.4">Smart irrigation · React + ESP8266</tspan></text>
  <text x="20" y="362" font-size="13" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.05s" dur="0.15s" fill="freeze"/><tspan fill="#9bc1bc">● </tspan><tspan fill="#edf1e8">Digital-Panchayat </tspan><tspan fill="#edf1e8" opacity="0.4">Civic desktop · Java + Swing + SQLite</tspan></text>

