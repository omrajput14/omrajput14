  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>
  <text x="380" y="23" text-anchor="middle" font-size="12" fill="#555">omrajput14 — zsh</text>
  <rect x="0" y="36" width="760" height="604" fill="#141414"/>

  <!-- ─────────────────────────────────────────
       PROMPT 1: whoami  (starts 0.3s)
