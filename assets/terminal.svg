  <text x="20" y="462" font-size="13" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="5.62s" dur="0.15s" fill="freeze"/><tspan fill="#9bc1bc">data      </tspan><tspan fill="#edf1e8" opacity="0.85">PostgreSQL · PostGIS · Redis · MongoDB · SQLite</tspan></text>
