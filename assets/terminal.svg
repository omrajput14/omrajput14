  <text y="154" class="text"><tspan x="20" class="teal">web</tspan><tspan class="dim">       </tspan><tspan class="coral">https://omrajput.me</tspan></text>
  <text y="174" class="text"><tspan x="20" class="teal">commits</tspan><tspan class="dim">   </tspan><tspan class="plain">1700+</tspan></text>
  <text y="194" class="text"><tspan x="20" class="teal">hireable</tspan><tspan class="dim">  </tspan><tspan class="green">true</tspan></text>

  <!-- ── ls systems/ ── -->
  <text y="226" class="text">
    <tspan x="20" class="coral">omrajput14</tspan><tspan class="dim">@github</tspan><tspan class="dim">:~$ </tspan><tspan class="cmd">ls systems/</tspan>
  </text>
  <text y="248" class="text"><tspan x="20" class="coral">●</tspan><tspan class="plain"> VETRA             </tspan><tspan class="dim">veterinary OS · Flutter + Spring Boot + PostGIS</tspan></text>
  <text y="268" class="text"><tspan x="20" class="teal">●</tspan><tspan class="plain"> VETRA-Gov         </tspan><tspan class="dim">disease surveillance · Java + PostgreSQL</tspan></text>
  <text y="288" class="text"><tspan x="20" fill="#f4f1bb">●</tspan><tspan class="plain"> AgriFlow          </tspan><tspan class="dim">export intelligence · React + FastAPI + Three.js</tspan></text>
  <text y="308" class="text"><tspan x="20" class="teal">●</tspan><tspan class="plain"> JalSetu           </tspan><tspan class="dim">municipal water · React + FastAPI + Razorpay</tspan></text>
  <text y="328" class="text"><tspan x="20" fill="#f4f1bb">●</tspan><tspan class="plain"> AgroShield        </tspan><tspan class="dim">crop protection · FastAPI + scikit-learn</tspan></text>
  <text y="348" class="text"><tspan x="20" class="coral">●</tspan><tspan class="plain"> EcoIrrigate       </tspan><tspan class="dim">smart irrigation · React + ESP8266</tspan></text>
  <text y="368" class="text"><tspan x="20" class="teal">●</tspan><tspan class="plain"> Digital-Panchayat </tspan><tspan class="dim">civic desktop · Java + Swing + SQLite</tspan></text>

  <!-- ── cat stack.txt ── -->
  <text y="400" class="text">
    <tspan x="20" class="coral">omrajput14</tspan><tspan class="dim">@github</tspan><tspan class="dim">:~$ </tspan><tspan class="cmd">cat stack.txt</tspan>
  </text>
  <text y="422" class="text"><tspan x="20" class="teal">backend</tspan><tspan class="dim">   </tspan><tspan class="plain">Java · Spring Boot · FastAPI · REST APIs · JWT</tspan></text>
  <text y="442" class="text"><tspan x="20" class="teal">data</tspan><tspan class="dim">      </tspan><tspan class="plain">PostgreSQL · PostGIS · Redis · MongoDB · SQLite</tspan></text>
  <text y="462" class="text"><tspan x="20" class="teal">mobile</tspan><tspan class="dim">    </tspan><tspan class="plain">Flutter · Dart · Firebase Cloud Messaging</tspan></text>
  <text y="482" class="text"><tspan x="20" class="teal">frontend</tspan><tspan class="dim">  </tspan><tspan class="plain">React · TypeScript · Tailwind CSS · GSAP · Lenis</tspan></text>
  <text y="502" class="text"><tspan x="20" class="teal">infra</tspan><tspan class="dim">     </tspan><tspan class="plain">Docker · Nginx · GitHub Actions · Azure</tspan></text>
  <text y="522" class="text"><tspan x="20" class="teal">ai</tspan><tspan class="dim">        </tspan><tspan class="plain">Gemini API · scikit-learn · Open-Meteo</tspan></text>

  <!-- ── ./contact.sh ── -->
  <text y="554" class="text">
    <tspan x="20" class="coral">omrajput14</tspan><tspan class="dim">@github</tspan><tspan class="dim">:~$ </tspan><tspan class="cmd">./contact.sh</tspan>
  </text>
  <text y="576" class="text"><tspan x="20" class="teal">web</tspan><tspan class="dim">    </tspan><tspan class="coral">https://omrajput.me</tspan></text>
  <text y="596" class="text"><tspan x="20" class="teal">email</tspan><tspan class="dim">  </tspan><tspan class="plain">omrajputt369@gmail.com</tspan></text>
  <text y="616" class="text"><tspan x="20" class="teal">github</tspan><tspan class="dim"> </tspan><tspan class="plain">github.com/omrajput14</tspan></text>
  <text y="636" class="text"><tspan x="20" class="teal">status</tspan><tspan class="dim"> </tspan><tspan class="green">open to backend &amp; systems roles</tspan></text>

  <!-- Final prompt + cursor -->
  <text y="668" class="text">
    <tspan x="20" class="coral">omrajput14</tspan><tspan class="dim">@github</tspan><tspan class="dim">:~$ </tspan><tspan class="coral">█</tspan>
  </text>
