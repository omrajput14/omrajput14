  <text x="20" y="112" font-size="13" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.1s"  dur="0.2s" fill="freeze"/><tspan fill="#9bc1bc">role      </tspan><tspan fill="#edf1e8" opacity="0.85">Systems Engineer — backend · spatial · mobile</tspan></text>
  <text x="20" y="132" font-size="13" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.3s"  dur="0.2s" fill="freeze"/><tspan fill="#9bc1bc">location  </tspan><tspan fill="#edf1e8" opacity="0.85">Nashik, Maharashtra</tspan></text>
  <text x="20" y="152" font-size="13" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.5s"  dur="0.2s" fill="freeze"/><tspan fill="#9bc1bc">web       </tspan><tspan fill="#ed6a5a">https://omrajput.me</tspan></text>
