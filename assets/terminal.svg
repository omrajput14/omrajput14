<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640">
  <defs>
    <style>text { font-family: 'JetBrains Mono','Fira Code','Cascadia Code','Menlo',monospace; }</style>

    <!-- Typing reveal clips: each command types out left→right -->
    <clipPath id="c1"><rect x="228" y="52" width="0" height="18"><animate attributeName="width" from="0" to="532" begin="0.3s" dur="0.45s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="228" y="214" width="0" height="18"><animate attributeName="width" from="0" to="532" begin="2.2s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="228" y="404" width="0" height="18"><animate attributeName="width" from="0" to="532" begin="4.8s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="228" y="536" width="0" height="18"><animate attributeName="width" from="0" to="532" begin="6.8s" dur="0.5s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- Background -->
  <rect width="760" height="640" rx="12" fill="#141414"/>

  <!-- Title bar -->
  <rect width="760" height="36" rx="12" fill="#1c1c1c"/>
  <rect y="18" width="760" height="18" fill="#1c1c1c"/>
