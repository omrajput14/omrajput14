<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#14172b"/>
      <stop offset="60%" stop-color="#0a0c16"/>
      <stop offset="100%" stop-color="#05060b"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Border Gradients -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="25%" stop-color="#7b2cbf" />
      <stop offset="50%" stop-color="#00bbf9" />
      <stop offset="75%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 64px; fill: url(#titleGrad); letter-spacing: 2px; }
    .mono { font-family: 'SF Mono', Monaco, 'Fira Code', 'Roboto Mono', Consolas, monospace; }
    .tag { font-size: 14px; fill: #67e8f9; letter-spacing: 6px; }
    .subtitle { font-size: 18px; fill: #94a3b8; letter-spacing: 3px; font-weight: 500; }
    .bottom-tag { font-size: 24px; fill: #5eead4; font-weight: 600; letter-spacing: 1px; }
  </style>

  <!-- Main Container -->
  <rect x="12" y="12" width="1000" height="276" rx="28" fill="url(#bgGlow)" />

  <!-- Outer Neon Pulse Border -->
  <rect x="28" y="28" width="968" height="244" rx="20" fill="none" stroke="url(#neonBorder)" stroke-width="2.5" opacity="0.3" filter="url(#glow)" />
  <rect x="28" y="28" width="968" height="244" rx="20" fill="none" stroke="url(#neonBorder)" stroke-width="2" />

  <!-- Corner Reticle Accents -->
  <!-- Top Left -->
  <path d="M 52 70 L 52 52 L 70 52" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" />
  <!-- Top Right -->
  <path d="M 972 70 L 972 52 L 954 52" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" />
  <!-- Bottom Left -->
  <path d="M 52 230 L 52 248 L 70 248" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" />
  <!-- Bottom Right -->
  <path d="M 972 230 L 972 248 L 954 248" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" />

  <!-- Side Lightning Zaps -->
  <!-- Left Bolt -->
  <path d="M 125 50 L 95 140 L 140 160 L 105 250" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" opacity="0.8" filter="url(#glow)" />
  <path d="M 125 50 L 95 140 L 140 160 L 105 250" fill="none" stroke="#e0f2fe" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Right Bolt -->
  <path d="M 899 50 L 929 140 L 884 160 L 919 250" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linejoin="round" opacity="0.8" filter="url(#glow)" />
  <path d="M 899 50 L 929 140 L 884 160 L 919 250" fill="none" stroke="#f5f3ff" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Ambient Micro Particles -->
  <circle cx="210" cy="80" r="1.5" fill="#a5f3fc" opacity="0.6"/>
  <circle cx="465" cy="110" r="1.5" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="800" cy="148" r="2" fill="#67e8f9" opacity="0.7"/>
  <circle cx="780" cy="225" r="1.5" fill="#a7f3d0" opacity="0.4"/>
  <circle cx="270" cy="220" r="1.5" fill="#e0e7ff" opacity="0.5"/>
  <circle cx="890" cy="90" r="2" fill="#c084fc" opacity="0.6"/>

  <!-- Centered Content -->
  <g transform="translate(512, 0)" text-anchor="middle">
    <!-- Top Monospace Tag -->
    <text y="78" class="mono tag" filter="url(#subtleGlow)">‹ OMRAJPUT14 ›</text>

    <!-- Main Name Title -->
    <text y="148" class="title" filter="url(#glow)">Om Rajput</text>

    <!-- Dashed Separator -->
    <line x1="-160" y1="168" x2="160" y2="168" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,5" opacity="0.6" />

    <!-- Subtitle -->
    <text y="196" class="subtitle mono">Frontend or full-stack engineer</text>
  </g>

  <!-- Bottom Accent Text -->
  <text x="512" y="336" text-anchor="middle" class="bottom-tag mono">Building with Python · TypeScript</text>
</svg>
