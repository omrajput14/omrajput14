<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" width="100%" height="100%">
  <defs>
    <filter id="softCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <radialGradient id="cardBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f1424" />
      <stop offset="100%" stop-color="#070913" />
    </radialGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .font-mono { font-family: 'SF Mono', Monaco, 'Fira Code', 'Roboto Mono', Consolas, monospace; }
    .h1-title { font-size: 32px; font-weight: 700; fill: #ffffff; letter-spacing: -0.5px; }
    .card-category { font-size: 13px; font-weight: 600; fill: #64748b; letter-spacing: 3px; }
    .card-title { font-size: 26px; font-weight: 600; fill: #f8fafc; letter-spacing: -0.2px; }
    .lang-name { font-size: 18px; font-weight: 600; fill: #f1f5f9; }
    .lang-pct { font-size: 13px; font-weight: 400; fill: #94a3b8; }
    .footer-quote { font-size: 16px; font-weight: 500; fill: #94a3b8; letter-spacing: 0.5px; }
  </style>

  <!-- Outside Top Header -->
  <text x="36" y="52" class="font-sans h1-title">The tools behind the signal</text>

  <!-- Main Card Container -->
  <g filter="url(#softCardShadow)">
    <rect x="30" y="80" width="964" height="460" rx="24" fill="url(#cardBg)" stroke="#1e293b" stroke-width="2" />
  </g>

  <!-- Inside Card Header -->
  <text x="75" y="136" class="font-mono card-category">TECHNOLOGY SPECTRUM</text>
  <text x="75" y="180" class="font-sans card-title">The tools behind the work</text>

  <!-- Dashed Line -->
  <line x1="75" y1="210" x2="949" y2="210" stroke="#1e293b" stroke-width="2" stroke-dasharray="8,6" />

  <!-- Language Grid -->
  <!-- 1. Python -->
  <g transform="translate(75, 240)">
    <!-- Icon Box -->
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <path d="M 22 10 C 16 10 13 12 13 16 L 13 19 L 22 19 L 22 20 L 10 20 C 10 24 12 28 17 28 L 19 28 L 19 25 C 19 22 22 20 25 20 L 31 20 C 33 20 34 19 34 16 C 34 12 30 10 22 10 Z" fill="#38bdf8"/>
    <path d="M 22 34 C 28 34 31 32 31 28 L 31 25 L 22 25 L 22 24 L 34 24 C 34 20 32 16 27 16 L 25 16 L 25 19 C 25 22 22 24 19 24 L 13 24 C 11 24 10 25 10 28 C 10 32 14 34 22 34 Z" fill="#facc15"/>
    <circle cx="17" cy="14" r="1.5" fill="#0f172a" />
    <circle cx="27" cy="30" r="1.5" fill="#0f172a" />

    <text x="0" y="75" class="font-sans lang-name">Python</text>
    <text x="0" y="100" class="font-mono lang-pct">83% of public code</text>
    <!-- Progress Bar (83% of 160 = ~133) -->
    <rect x="0" y="120" width="160" height="4" rx="2" fill="#1e293b" />
    <rect x="0" y="120" width="133" height="4" rx="2" fill="#38bdf8" />
  </g>

  <!-- 2. TypeScript -->
  <g transform="translate(290, 240)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="4" y="4" width="36" height="36" rx="7" fill="#3178c6" />
    <text x="22" y="28" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="20" fill="#ffffff">TS</text>

    <text x="0" y="75" class="font-sans lang-name">TypeScript</text>
    <text x="0" y="100" class="font-mono lang-pct">5% of public code</text>
    <rect x="0" y="120" width="160" height="4" rx="2" fill="#1e293b" />
    <rect x="0" y="120" width="16" height="4" rx="2" fill="#38bdf8" />
  </g>

  <!-- 3. HTML -->
  <g transform="translate(505, 240)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="4" y="4" width="36" height="36" rx="7" fill="#e34f26" />
    <text x="22" y="28" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="22" fill="#ffffff">5</text>

    <text x="0" y="75" class="font-sans lang-name">HTML</text>
    <text x="0" y="100" class="font-mono lang-pct">4% of public code</text>
    <rect x="0" y="120" width="160" height="4" rx="2" fill="#1e293b" />
    <rect x="0" y="120" width="14" height="4" rx="2" fill="#f97316" />
  </g>

  <!-- 4. JavaScript -->
  <g transform="translate(720, 240)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="4" y="4" width="36" height="36" rx="7" fill="#f7df1e" />
    <text x="22" y="28" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="20" fill="#000000">JS</text>

    <text x="0" y="75" class="font-sans lang-name">JavaScript</text>
    <text x="0" y="100" class="font-mono lang-pct">4% of public code</text>
    <rect x="0" y="120" width="160" height="4" rx="2" fill="#1e293b" />
    <rect x="0" y="120" width="14" height="4" rx="2" fill="#facc15" />
  </g>

  <!-- 5. Java -->
  <g transform="translate(75, 400)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="22" y="28" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="22" fill="#f97316">J</text>

    <text x="0" y="65" class="font-sans lang-name">Java</text>
    <text x="0" y="90" class="font-mono lang-pct">3% of public code</text>
    <rect x="0" y="105" width="160" height="4" rx="2" fill="#1e293b" />
    <rect x="0" y="105" width="12" height="4" rx="2" fill="#f59e0b" />
  </g>

  <!-- Bottom Subtitle Quote -->
  <g transform="translate(512, 595)" text-anchor="middle">
    <text class="font-sans footer-quote">Python · TypeScript · HTML · JavaScript · Java · CSS · Dockerfile · Go · chosen for the work, not the trend</text>
    <path d="M -300 24 L -30 24 M -20 24 L -10 24 L 0 16 L 10 24 L 20 24 M 30 24 L 300 24" stroke="#334155" stroke-width="1.5" fill="none" />
  </g>
</svg>
