<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <!-- Pixel Font Import -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;display=swap');
      .pixel-arcade { font-family: 'Press Start 2P', monospace, monospace; }
      .marquee-text { font-family: 'Press Start 2P', monospace; font-size: 26px; fill: #0b1329; letter-spacing: 4px; }
      .screen-score { font-family: 'Press Start 2P', monospace; font-size: 15px; fill: #ffffff; letter-spacing: 2px; }
      .screen-1up { font-family: 'Press Start 2P', monospace; font-size: 16px; fill: #ff4d6d; letter-spacing: 2px; font-weight: bold; }
      .insert-coin { font-family: 'Press Start 2P', monospace; font-size: 14px; fill: #fbbf24; letter-spacing: 3px; }
    </style>

    <!-- CRT Glow Filter -->
    <filter id="crtGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="cabBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111524" />
      <stop offset="50%" stop-color="#1e243b" />
      <stop offset="100%" stop-color="#111524" />
    </linearGradient>

    <linearGradient id="marqueeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <radialGradient id="screenGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#121a36" />
      <stop offset="100%" stop-color="#060914" />
    </radialGradient>

    <linearGradient id="deckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3250" />
      <stop offset="100%" stop-color="#151a2b" />
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- 3D Joystick Ball Gradient -->
    <radialGradient id="joyBall" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="90%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>

    <!-- 3D Buttons Gradients -->
    <radialGradient id="btnYellow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </radialGradient>

    <radialGradient id="btnGreen" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#14532d" />
    </radialGradient>

    <radialGradient id="btnBlue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>
  </defs>

  <!-- Background Base / Drop Shadow -->
  <g filter="url(#softShadow)">
    <!-- Arcade Outer Wings & Hood -->
    <path d="M 230 30 L 770 30 L 795 120 L 795 490 L 825 540 L 825 610 L 175 610 L 175 540 L 205 490 L 205 120 Z" fill="url(#cabBody)" stroke="#2d375a" stroke-width="3" />
  </g>

  <!-- Side Chamfer Edges (Perspective 3D Depth) -->
  <polygon points="230,30 205,120 205,490 175,540 175,610 200,610 235,510 235,120" fill="#0c0e18" opacity="0.65" />
  <polygon points="770,30 795,120 795,490 825,540 825,610 800,610 765,510 765,120" fill="#0c0e18" opacity="0.65" />

  <!-- Top Marquee Signboard -->
  <rect x="250" y="45" width="500" height="72" rx="10" fill="url(#marqueeGlow)" stroke="#1d4ed8" stroke-width="3" />
  <rect x="254" y="49" width="492" height="64" rx="8" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.6" />
  <text x="500" y="93" text-anchor="middle" class="marquee-text">OM RAJPUT</text>

  <!-- Screen Bezel Outer Housing -->
  <rect x="245" y="140" width="510" height="345" rx="18" fill="#080a12" stroke="#1f253d" stroke-width="3" />

  <!-- CRT Screen Surface -->
  <rect x="265" y="158" width="470" height="308" rx="12" fill="url(#screenGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- CRT Scanlines Pattern -->
  <g opacity="0.08">
    <line x1="265" y1="180" x2="735" y2="180" stroke="#ffffff" stroke-width="1"/>
    <line x1="265" y1="210" x2="735" y2="210" stroke="#ffffff" stroke-width="1"/>
    <line x1="265" y1="240" x2="735" y2="240" stroke="#ffffff" stroke-width="1"/>
    <line x1="265" y1="270" x2="735" y2="270" stroke="#ffffff" stroke-width="1"/>
    <line x1="265" y1="300" x2="735" y2="300" stroke="#ffffff" stroke-width="1"/>
    <line x1="265" y1="330" x2="735" y2="330" stroke="#ffffff" stroke-width="1"/>
    <line x1="265" y1="360" x2="735" y2="360" stroke="#ffffff" stroke-width="1"/>
    <line x1="265" y1="390" x2="735" y2="390" stroke="#ffffff" stroke-width="1"/>
    <line x1="265" y1="420" x2="735" y2="420" stroke="#ffffff" stroke-width="1"/>
    <line x1="265" y1="450" x2="735" y2="450" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Stars Field -->
  <circle cx="295" cy="230" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="340" cy="195" r="1.2" fill="#93c5fd" opacity="0.5"/>
  <circle cx="458" cy="238" r="1.8" fill="#ffffff" opacity="0.8"/>
  <circle cx="482" cy="190" r="1.2" fill="#e0e7ff" opacity="0.7"/>
  <circle cx="610" cy="270" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="670" cy="205" r="1.6" fill="#38bdf8" opacity="0.7"/>
  <circle cx="712" cy="245" r="1.2" fill="#ffffff" opacity="0.5"/>
  <circle cx="640" cy="360" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="320" cy="340" r="1.2" fill="#93c5fd" opacity="0.5"/>

  <!-- Screen HUD Headers -->
  <text x="290" y="200" class="screen-score" filter="url(#crtGlow)">SCORE 2154</text>
  <text x="705" y="200" text-anchor="end" class="screen-1up" filter="url(#crtGlow)">1UP</text>

  <!-- Cityscape 3D Contribution Histogram Bars -->
  <!-- Base Ground Line -->
  <line x1="285" y1="440" x2="715" y2="440" stroke="#1e293b" stroke-width="3" />

  <!-- Bars Array -->
  <!-- Bar 1 -->
  <rect x="295" y="390" width="18" height="50" fill="#1d4ed8"/>
  <rect x="295" y="386" width="18" height="4" fill="#93c5fd"/>
  <!-- Bar 2 -->
  <rect x="315" y="380" width="18" height="60" fill="#2563eb"/>
  <rect x="315" y="376" width="18" height="4" fill="#93c5fd"/>
  <!-- Bar 3 -->
  <rect x="335" y="355" width="18" height="85" fill="#1e40af"/>
  <rect x="335" y="351" width="18" height="4" fill="#bfdbfe"/>
  <!-- Bar 4 -->
  <rect x="355" y="365" width="18" height="75" fill="#2563eb"/>
  <rect x="355" y="361" width="18" height="4" fill="#93c5fd"/>
  <!-- Bar 5 -->
  <rect x="375" y="358" width="18" height="82" fill="#1d4ed8"/>
  <rect x="375" y="354" width="18" height="4" fill="#bfdbfe"/>
  <!-- Bar 6 -->
  <rect x="395" y="380" width="18" height="60" fill="#1e3a8a"/>
  <rect x="395" y="376" width="18" height="4" fill="#93c5fd"/>
  <!-- Bar 7 -->
  <rect x="415" y="368" width="18" height="72" fill="#2563eb"/>
  <rect x="415" y="364" width="18" height="4" fill="#93c5fd"/>
  <!-- Bar 8 -->
  <rect x="435" y="335" width="18" height="105" fill="#3b82f6"/>
  <rect x="435" y="331" width="18" height="4" fill="#dbeafe"/>

  <!-- Sprite Character 'A' on bar 8 side -->
  <rect x="424" y="352" width="8" height="14" fill="#ffffff" rx="1"/>
  <rect x="426" y="355" width="4" height="3" fill="#000000"/>

  <!-- Bar 9 (Tall Peak 1) -->
  <rect x="455" y="270" width="18" height="170" fill="#2563eb"/>
  <rect x="455" y="266" width="18" height="4" fill="#bfdbfe"/>

  <!-- Yellow floating coin/block above peak -->
  <rect x="459" y="242" width="10" height="10" fill="#fbbf24" stroke="#fef08a" stroke-width="1.5" rx="1" filter="url(#crtGlow)"/>

  <!-- Bar 10 (Peak 2) -->
  <rect x="475" y="320" width="18" height="120" fill="#1d4ed8"/>
  <rect x="475" y="316" width="18" height="4" fill="#93c5fd"/>

  <!-- Second floating coin -->
  <rect x="481" y="290" width="10" height="10" fill="#fbbf24" stroke="#fef08a" stroke-width="1.5" rx="1" filter="url(#crtGlow)"/>

  <!-- Bar 11 -->
  <rect x="495" y="375" width="18" height="65" fill="#1e40af"/>
  <rect x="495" y="371" width="18" height="4" fill="#93c5fd"/>
  <!-- Bar 12 -->
  <rect x="515" y="360" width="18" height="80" fill="#2563eb"/>
  <rect x="515" y="356" width="18" height="4" fill="#bfdbfe"/>
  <!-- Bar 13 -->
  <rect x="535" y="390" width="18" height="50" fill="#1e3a8a"/>
  <rect x="535" y="386" width="18" height="4" fill="#93c5fd"/>
  <!-- Bar 14 -->
  <rect x="555" y="370" width="18" height="70" fill="#1d4ed8"/>
  <rect x="555" y="366" width="18" height="4" fill="#93c5fd"/>
  <!-- Bar 15 -->
  <rect x="575" y="392" width="18" height="48" fill="#1e40af"/>
  <rect x="575" y="388" width="18" height="4" fill="#bfdbfe"/>
  <!-- Bar 16 -->
  <rect x="595" y="380" width="18" height="60" fill="#2563eb"/>
  <rect x="595" y="376" width="18" height="4" fill="#93c5fd"/>
  <!-- Bar 17 -->
  <rect x="615" y="365" width="18" height="75" fill="#3b82f6"/>
  <rect x="615" y="361" width="18" height="4" fill="#dbeafe"/>
  <!-- Bar 18 -->
  <rect x="635" y="395" width="18" height="45" fill="#1d4ed8"/>
  <rect x="635" y="391" width="18" height="4" fill="#93c5fd"/>
  <!-- Bar 19 -->
  <rect x="655" y="398" width="18" height="42" fill="#1e3a8a"/>
  <rect x="655" y="394" width="18" height="4" fill="#93c5fd"/>
  <!-- Bar 20 -->
  <rect x="675" y="410" width="18" height="30" fill="#1d4ed8"/>
  <rect x="675" y="406" width="18" height="4" fill="#93c5fd"/>
  <!-- Bar 21 -->
  <rect x="695" y="396" width="18" height="44" fill="#2563eb"/>
  <rect x="695" y="392" width="18" height="4" fill="#bfdbfe"/>

  <!-- Slanted 3D Control Deck Panel -->
  <polygon points="210,490 790,490 825,542 175,542" fill="url(#deckGrad)" stroke="#333e66" stroke-width="2" />
  <line x1="175" y1="542" x2="825" y2="542" stroke="#4c5a8a" stroke-width="2.5" />

  <!-- Joystick (Left Side) -->
  <!-- Base Washer -->
  <ellipse cx="340" cy="530" rx="20" ry="8" fill="#090d1a" stroke="#1f2942" stroke-width="2" />
  <!-- Shaft -->
  <line x1="340" y1="530" x2="335" y2="505" stroke="#475569" stroke-width="6" stroke-linecap="round" />
  <!-- 3D Red Ball -->
  <circle cx="334" cy="495" r="16" fill="url(#joyBall)" stroke="#991b1b" stroke-width="1" filter="url(#softShadow)" />

  <!-- 3D Arcade Push Buttons (Right Side) -->
  <!-- Yellow Button -->
  <ellipse cx="585" cy="524" rx="16" ry="11" fill="url(#btnYellow)" stroke="#713f12" stroke-width="1.5" />
  <ellipse cx="585" cy="521" rx="12" ry="7" fill="none" stroke="#fef08a" stroke-width="1" opacity="0.6" />

  <!-- Green Button -->
  <ellipse cx="640" cy="524" rx="16" ry="11" fill="url(#btnGreen)" stroke="#064e3b" stroke-width="1.5" />
  <ellipse cx="640" cy="521" rx="12" ry="7" fill="none" stroke="#bbf7d0" stroke-width="1" opacity="0.6" />

  <!-- Blue Button -->
  <ellipse cx="695" cy="524" rx="16" ry="11" fill="url(#btnBlue)" stroke="#1e3a8a" stroke-width="1.5" />
  <ellipse cx="695" cy="521" rx="12" ry="7" fill="none" stroke="#bfdbfe" stroke-width="1" opacity="0.6" />

  <!-- Lower Cabinet Base -->
  <rect x="220" y="544" width="560" height="66" fill="#0f1322" stroke="#1f253d" stroke-width="2" />

  <!-- Insert Coin Section -->
  <text x="500" y="582" text-anchor="middle" class="insert-coin" filter="url(#crtGlow)">INSERT COIN</text>
  <rect x="475" y="596" width="50" height="4" rx="2" fill="#334155" stroke="#475569" stroke-width="1" />
</svg>
