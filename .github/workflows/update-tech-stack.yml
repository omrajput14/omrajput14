name: Update Language Stats

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from Actions tab
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/**'
      - 'koi/**'
      - 'README.md'

jobs:
  update-languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Calculate and render animated language spectrum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/update_languages.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/tech-stack.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update animated language statistics" && git push)
